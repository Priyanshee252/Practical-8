<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechMart Product Management</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>TechMart Electronics</h1>
      <p>Product Management System</p>
    </div>
  </header>

  <main class="wrap">
    <div id="message" class="msg hidden" role="status"></div>

    <div class="stats">
      <div class="stat"><span>Total Products</span><strong id="statProducts">0</strong></div>
      <div class="stat"><span>Total Stock (units)</span><strong id="statStock">0</strong></div>
      <div class="stat"><span>Inventory Value</span><strong id="statValue">&#8377;0.00</strong></div>
    </div>

    <section class="card">
      <h2 id="formTitle">Add New Product</h2>
      <form id="productForm" novalidate>
        <input type="hidden" id="recordId">
        <div class="grid">
          <div>
            <label for="productId">Product ID</label>
            <input type="text" id="productId" maxlength="20" placeholder="e.g. TM-101">
          </div>
          <div>
            <label for="productName">Product Name</label>
            <input type="text" id="productName" maxlength="100" placeholder="e.g. Wireless Mouse">
          </div>
          <div>
            <label for="category">Category</label>
            <input type="text" id="category" maxlength="50" placeholder="e.g. Accessories">
          </div>
          <div>
            <label for="price">Price (&#8377;)</label>
            <input type="number" id="price" min="0" step="0.01" placeholder="0.00">
          </div>
          <div>
            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" min="0" step="1" placeholder="0">
          </div>
          <div class="full">
            <label for="description">Description</label>
            <textarea id="description" rows="3" maxlength="500" placeholder="Short product description"></textarea>
          </div>
        </div>
        <div class="actions">
          <button type="submit" id="saveBtn">Add Product</button>
          <button type="button" id="cancelBtn" class="gray hidden">Cancel</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>All Products</h2>
      <div class="tbl-wrap">
        <table>
          <thead>
            <tr>
              <th>Product ID</th><th>Name</th><th>Category</th>
              <th>Price</th><th>Qty</th><th>Description</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="productTable"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
